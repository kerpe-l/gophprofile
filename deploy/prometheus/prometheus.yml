global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

scrape_configs:
  - job_name: server
    static_configs:
      - targets: [ "server:8080" ]

  - job_name: worker
    static_configs:
      - targets: [ "worker:9090" ]

  # Плагин rabbitmq_prometheus: глубина очередей, unacked, rates.
  - job_name: rabbitmq
    static_configs:
      - targets: [ "rabbitmq:15692" ]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [ "minio:9000" ]

  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: alertmanager
    static_configs:
      - targets: [ "alertmanager:9093" ]
