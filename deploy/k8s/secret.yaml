# Dev-креды локального кластера; в prod Secret приходит извне.
apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secrets
  namespace: gophprofile
type: Opaque
stringData:
  DATABASE_DSN: postgres://gophprofile:gophprofile@db:5432/gophprofile?sslmode=disable
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  AMQP_URL: amqp://guest:guest@rabbitmq:5672/
  POSTGRES_USER: gophprofile
  POSTGRES_PASSWORD: gophprofile
  POSTGRES_DB: gophprofile
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
