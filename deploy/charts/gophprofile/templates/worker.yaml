apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: gophprofile
      # WORKER_SHUTDOWN_TIMEOUT плюс flush спанов и остановка листенера метрик.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "gophprofile.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: {{ include "gophprofile.secretName" . }}
          env:
            - name: GOMEMLIMIT
              value: {{ .Values.worker.gomemlimit | quote }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
