{{- if .Values.secrets.create }}
# Dev-креды локального кластера; в prod Secret приходит извне (secrets.existingSecret).
apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secrets
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
