apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gophprofile
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Только API и веб-интерфейс: /metrics и /health снаружи не видны.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
