# Правила алертинга: доля ошибок HTTP, p95 задержки, рост DLQ, недоступность
# таргетов. Пороги под локальный стек.
groups:
  - name: gophprofile
    rules:
      - alert: HighHTTPErrorRate
        expr: >
          (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
          / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Доля 5xx выше 5%
          description: >-
            {{ $value | humanizePercentage }} HTTP-запросов за последние
            5 минут завершаются ошибкой сервера.

      - alert: HighHTTPLatency
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 длительности HTTP-запроса выше 500ms
          description: p95 за последние 5 минут — {{ $value | humanizeDuration }}.

      - alert: DLQGrowth
        expr: increase(rabbitmq_queue_messages{queue="avatars.dead"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Растёт очередь мёртвых сообщений
          description: >-
            За 10 минут в avatars.dead попало {{ $value | humanize }} сообщений:
            обработка исчерпала повторы.

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Таргет {{ $labels.job }} недоступен
          description: Prometheus не может собрать метрики с {{ $labels.instance }}.
