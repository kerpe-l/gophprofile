version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gocritic
    - goconst
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - predeclared
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
    spancheck:
      checks:
        - end
        - record-error
        - set-status
      ignore-check-signatures:
        - observability\.SpanError
    usetesting:
      context-background: true
      context-todo: true

  exclusions:
    rules:
      # В тестах фикстуры и ожидаемые значения повторяются по делу,
      # а таблицы кейсов регулярно длиннее порога дублирования.
      - path: _test\.go
        linters:
          - goconst
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kerpe-l/gophprofile
