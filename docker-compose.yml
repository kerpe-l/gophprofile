# Локальное окружение GophProfile: инфраструктура, одноразовые
# инициализаторы и оба бинарника сервиса.
#
# Учётные данные заданы значениями по умолчанию, чтобы окружение поднималось
# одной командой из чистого клона. Это dev-креды для локальной машины: в
# реальном развёртывании они приходят из менеджера секретов.
name: gophprofile

x-base-env: &base-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  DATABASE_DSN: postgres://${POSTGRES_USER:-gophprofile}:${POSTGRES_PASSWORD:-gophprofile}@db:5432/${POSTGRES_DB:-gophprofile}?sslmode=disable

x-app-env: &app-env
  <<: *base-env
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-avatars}
  S3_USE_SSL: "false"
  AMQP_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/

x-build-args: &build-args
  VERSION: ${VERSION:-dev}
  BUILD_DATE: ${BUILD_DATE:-unknown}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gophprofile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophprofile}
      POSTGRES_DB: ${POSTGRES_DB:-gophprofile}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gophprofile} -d ${POSTGRES_DB:-gophprofile}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Одноразовый контейнер: создаёт бакет и выходит.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    entrypoint: [ "/usr/bin/mc" ]
    command: [ "mb", "--ignore-existing", "local/${S3_BUCKET:-avatars}" ]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: build/Dockerfile.migrator
      args: *build-args
    environment: *base-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: build/Dockerfile.server
      args: *build-args
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
      args: *build-args
    environment: *app-env
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
  rabbitmq-data:
