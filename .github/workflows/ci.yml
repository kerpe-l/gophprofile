name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test ./... -race -count=1

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test -tags=integration ./... -race -count=1

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  chart:
    name: Helm chart and OpenAPI
    runs-on: ubuntu-latest
    env:
      CHART: deploy/charts/gophprofile
      # Значения, обязательные для prod-рендера.
      PROD_SET: >-
        --set secrets.existingSecret=ci
        --set config.s3Endpoint=s3.example.com:443
        --set networkPolicy.externalEgress.cidr=10.0.0.0/8
      # Схемы CRD (ServiceMonitor) — из каталога datree.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0

      - run: helm lint $CHART -f $CHART/values-dev.example.yaml
      - run: helm lint $CHART -f $CHART/values-prod.yaml $PROD_SET

      - run: >-
          helm template gophprofile $CHART -n gophprofile -f $CHART/values-dev.example.yaml
          | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS"
      - run: >-
          helm template gophprofile $CHART -n gophprofile -f $CHART/values-prod.yaml $PROD_SET
          | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS"

      - run: npx --yes @redocly/cli@2 lint api/openapi.yaml

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - run: docker compose build

      - run: docker compose up -d

      - run: |
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8080/health | tee /dev/stderr | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "health check did not become ok" >&2
          exit 1

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
