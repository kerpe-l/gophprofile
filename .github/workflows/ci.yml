name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test ./... -race -count=1

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test -tags=integration ./... -race -count=1

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - run: docker compose build

      - run: docker compose up -d

      - run: |
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8080/health | tee /dev/stderr | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "health check did not become ok" >&2
          exit 1

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
